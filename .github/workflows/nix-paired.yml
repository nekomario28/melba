name: Nix paired Release smoke

# The paired Nix package downloads an already-published GUI archive.
# Validate it when its definition changes and periodically, not on every PR.
on:
  pull_request:
    paths:
      - ".github/workflows/nix-paired.yml"
      - "crates/melba/flake.nix"
      - "crates/melba/flake.lock"
      - "crates/melba/nix/**"
      - "crates/melba/packaging/melba.desktop"
      - "crates/melba/packaging/icons/melba.svg"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: nix-paired-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nix-paired-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Parse and evaluate native Nix flake
        shell: bash
        run: |
          set -euo pipefail
          nix --version
          # Evaluate the checked-in lock; never update it in CI.
          nix-instantiate --parse crates/melba/flake.nix >/dev/null
          nix eval --raw ./crates/melba#packages.x86_64-linux.melba-paired.name
      - name: Build and run pinned paired signed-release package
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-link ./crates/melba#melba-paired
          out=$(nix eval --raw ./crates/melba#packages.x86_64-linux.melba-paired.outPath)
          test -x "$out/bin/melba"
          test -x "$out/bin/melbad"
          "$out/bin/melba" --version
          "$out/bin/melbad" --version
