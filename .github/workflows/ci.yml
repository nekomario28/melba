name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  readme-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate README language, links and installer pin
        run: python3 ci/test_readme_docs.py

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: system deps (alsa, dbus, gtk/webkit for tao+wry)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev libdbus-1-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libglib2.0-bin xdg-utils ffmpeg
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-about --version 0.8.4 --locked
      - run: cargo fetch --locked && cargo fetch --locked --manifest-path crates/melba/Cargo.toml
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Linux-only daemon integration (including sign-in subprocess resolution)
      # is not compiled by the windows-check job below.
      - run: cargo test --locked --manifest-path crates/melba/Cargo.toml --all-features --lib
      - run: cargo build
      # check.sh fail-closes on real gates (cargo.test, import×3, scan,
      # licenses) and honestly skips what the runner lacks (no
      # /proc/asound → probe, no session bus → mpris, no gx tools → gx.*).
      - run: MELBA_BIN=./target/debug/melbad ./ci/check.sh

  # The melba crate must keep compiling on the other desktop targets; a
  # cfg gate once swallowed eframe::run_native entirely. A check build
  # never links, so no MinGW toolchain is needed on the runner.
  windows-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: rustup target add x86_64-pc-windows-gnu
        working-directory: crates/melba
      - name: MinGW C compiler for the Windows target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --target x86_64-pc-windows-gnu --all-targets
        working-directory: crates/melba

  # Non-blocking on purpose. The 2026-10-27 lockfile bump cleared the
  # quinn-proto, rustls, webpki-roots and webpki-root-certs advisories.
  # cargo-audit 0.22.2 still exits 1 for rustls-webpki 0.103.15
  # (RUSTSEC-2026-0382), which has no fixed stable release yet.
  # Drop continue-on-error when a fixed rustls-webpki is available.
  cargo-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-audit (pinned binary)
        run: |
          set -uo pipefail
          tgz="${RUNNER_TEMP}/cargo-audit.tgz"
          curl -fsSL --retry 3 -o "$tgz" \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  $tgz" | sha256sum -c
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          audit="${RUNNER_TEMP}/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit"
          rc=0
          "$audit" audit --file Cargo.lock || rc=1
          "$audit" audit --file crates/melba/Cargo.lock || rc=1
          exit "$rc"

  # Full history. Fails on findings. The one historical generic-api-key
  # hit (084f29b, removed crates/aml-ui2/src/zeroconf.rs, Spotifast import
  # test string) is allowlisted in .gitleaks.toml.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (pinned binary)
        run: |
          set -euo pipefail
          tgz="${RUNNER_TEMP}/gitleaks.tgz"
          curl -fsSL --retry 3 -o "$tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tgz" | sha256sum -c
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --exit-code 1
