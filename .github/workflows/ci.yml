name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# A push that supersedes an unfinished run should cancel it. Without this,
# three pushes to one pull request run three complete matrices at once, which
# is most of what made CI look expensive: the later runs answer a question
# nobody is waiting for any more.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    # The suite takes about 12 minutes. Without a limit a stalled mirror left
    # this job in `apt-get update` for 44 minutes with nothing to stop it,
    # blocking a release PR behind a check that would never conclude. The limit
    # is a backstop, not a budget: a mirror that is merely slow still has to
    # fit (one took 30 minutes for the GTK/WebKit headers alone), while a
    # stalled socket now errors after 30 seconds thanks to ci/apt-transfers.sh.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the system packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Keyed on the workflow, so a changed package list misses the cache
          # instead of installing a stale set.
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
      - name: Release signing script syntax and missing-key fail-closed gate
        run: |
          set -euo pipefail
          bash -n ci/prepare_signed_release.sh
          if env -u MELBA_SIGNING_KEY_PEM bash ci/prepare_signed_release.sh /tmp/does-not-exist 0.3.13; then
            echo "Release signing must fail without the publisher key" >&2
            exit 1
          fi
      - name: system deps (alsa, dbus, gtk/webkit for tao+wry)
        run: |
          bash ci/apt-transfers.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev libdbus-1-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libglib2.0-bin xdg-utils ffmpeg
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-about --version 0.8.4 --locked
      - run: cargo fetch --locked && cargo fetch --locked --manifest-path crates/melba/Cargo.toml
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Linux-only daemon integration (including sign-in subprocess resolution)
      # is not compiled by the windows-check job below. One invocation: `--lib`
      # and `--tests` used to build the same crate twice for the same features.
      # Both targets must stay listed — `--lib` alone never ran localization,
      # which is how a stale gettext template stayed broken.
      - run: cargo test --locked --manifest-path crates/melba/Cargo.toml --all-features --lib --tests
      - run: cargo build
      # check.sh fail-closes on real gates (cargo.test, import×3, scan,
      # licenses) and honestly skips what the runner lacks (no
      # /proc/asound → probe, no session bus → mpris, no gx tools → gx.*).
      - run: MELBA_BIN=./target/debug/melbad ./ci/check.sh

  # End-to-end smoke tests the real signed public Release (not fixture data).
  release-install-smoke:
    # The host path, not a container: the installer resolves the desktop file
    # and the XDG links against a real system. Since v0.3.13 the published
    # archives need glibc 2.35, so any current runner qualifies; this one is
    # simply the newest Ubuntu host.
    runs-on: ubuntu-26.04
    # Installing the published release pulls in WebKitGTK and its dependency
    # set (over 100 MB) from the runner's mirror. At 15 minutes that download
    # has twice been cut off mid-transfer and reported as a cancelled job, so
    # the budget covers a slow mirror rather than the work itself.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail fast on a stalled package mirror
        shell: bash
        # A mirror that stops sending bytes is what burns the whole budget;
        # retries plus a socket timeout turn that into an error we can see.
        run: bash ci/apt-transfers.sh
      - name: Verify signed release and install paired binaries
        shell: bash
        run: |
          set -euo pipefail
          export MELBA_PORTABLE_DIR="$RUNNER_TEMP/melba-install-smoke/app"
          export XDG_BIN_HOME="$RUNNER_TEMP/melba-install-smoke/bin"
          export XDG_DATA_HOME="$RUNNER_TEMP/melba-install-smoke/data"
          sh packaging/install-release.sh --no-alac
          test -f "$MELBA_PORTABLE_DIR/melba-portable.txt"
          test -L "$XDG_BIN_HOME/melba"
          test -L "$XDG_BIN_HOME/melbad"
          test -f "$XDG_DATA_HOME/applications/melba.desktop"
          "$MELBA_PORTABLE_DIR/melba" --version
          "$MELBA_PORTABLE_DIR/melbad" --version
          gui=$("$MELBA_PORTABLE_DIR/melba" --version)
          daemon=$("$MELBA_PORTABLE_DIR/melbad" --version)
          test "${gui#melba }" = "${daemon#melbad }"

  # Exercise the real Arch package manager rather than just stubbing pacman.
  # CachyOS inherits the same package ecosystem; its os-release values are
  # supplied using the installer's existing test override.
  arch-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap tools required by the standalone release installer
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed ca-certificates curl openssl
          update-ca-trust || true
      - name: Real pacman ALAC preflight using CachyOS distro metadata
        shell: bash
        run: |
          set -euo pipefail
          printf 'ID=cachyos\nID_LIKE=arch\n' > "$RUNNER_TEMP/melba-os-release"
          export MELBA_INSTALL_OS_RELEASE="$RUNNER_TEMP/melba-os-release"
          sh packaging/install-deps.sh --alac
          command -v bash
          command -v curl
          command -v unzip
          command -v file
          command -v cc
      - name: Real signed Release installation with dynamic library provisioning
        shell: bash
        run: |
          set -euo pipefail
          export MELBA_INSTALL_OS_RELEASE="$RUNNER_TEMP/melba-os-release"
          export MELBA_PORTABLE_DIR="$RUNNER_TEMP/melba-portable"
          export XDG_BIN_HOME="$RUNNER_TEMP/melba-bin"
          export XDG_DATA_HOME="$RUNNER_TEMP/melba-data"
          sh packaging/install-release.sh --no-alac
          test -L "$XDG_BIN_HOME/melba"
          test -L "$XDG_BIN_HOME/melbad"
          "$MELBA_PORTABLE_DIR/melba" --version
          "$MELBA_PORTABLE_DIR/melbad" --version


  # Exercise real apt/dnf transactions and verify the glibc compatibility
  # boundary against the actual signed published release (not mocked tools).
  distro-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Every image here can run the published release: since v0.3.13 the
      # archives need glibc 2.35, not 2.43. ubuntu-22.04 and debian-12 are the
      # floor and exist to pin it. The refusal path (an older glibc installs
      # nothing) is pinned by ci/test_packaging.py, which stubs `ldd`; no
      # maintained image in this matrix is below the baseline, and adding an
      # end-of-life one would make the job fail for mirror reasons instead.
      matrix:
        include:
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            manager: apt-get
          - distro: debian-12
            image: debian:bookworm
            manager: apt-get
          - distro: debian-13
            image: debian:trixie
            manager: apt-get
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            manager: apt-get
          - distro: ubuntu-26.04
            image: ubuntu:26.04
            manager: apt-get
          - distro: fedora-43
            image: fedora:43
            manager: dnf
          - distro: fedora-44
            image: fedora:44
            manager: dnf
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap release installer prerequisites
        shell: bash
        env:
          PKG_MANAGER: ${{ matrix.manager }}
        run: |
          set -euo pipefail
          if [[ "$PKG_MANAGER" = apt-get ]]; then
            bash ci/apt-transfers.sh
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl openssl
          else
            dnf -y install ca-certificates curl openssl
          fi
      - name: Install ALAC helper prerequisites through actual apt or dnf
        shell: bash
        run: |
          set -euo pipefail
          sh packaging/install-deps.sh --alac
          for tool in bash curl unzip file cc; do command -v "$tool"; done
      - name: Install the published signed Release and run both binaries
        shell: bash
        run: |
          set -euo pipefail
          export MELBA_PORTABLE_DIR="$RUNNER_TEMP/melba-distro-test/app"
          export XDG_BIN_HOME="$RUNNER_TEMP/melba-distro-test/bin"
          export XDG_DATA_HOME="$RUNNER_TEMP/melba-distro-test/data"
          sh packaging/install-release.sh --no-alac
          test -L "$XDG_BIN_HOME/melba"
          test -L "$XDG_BIN_HOME/melbad"
          "$MELBA_PORTABLE_DIR/melba" --version
          "$MELBA_PORTABLE_DIR/melbad" --version

  # Nix syntax and flake evaluation are separate from an actual NixOS image
  # or a paired melba/melbad installation. Keep that distinction in docs.
  nix-flake-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Parse and evaluate native Nix flake
        shell: bash
        run: |
          set -euo pipefail
          nix --version
          # Never update the checked-in flake.lock in CI: validate the
          # reviewed, reproducible nixpkgs revision as delivered.
          nix-instantiate --parse crates/melba/flake.nix >/dev/null
          # Pinned nixpkgs 26.11 intentionally drops x86_64-darwin; evaluate
          # the supported Linux package rather than every legacy output.
          nix eval --raw ./crates/melba#packages.x86_64-linux.melba-paired.name
      - name: Build a paired signed-release Nix package
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-link ./crates/melba#melba-paired
          out=$(nix eval --raw ./crates/melba#packages.x86_64-linux.melba-paired.outPath)
          test -x "$out/bin/melba"
          test -x "$out/bin/melbad"
          "$out/bin/melba" --version
          "$out/bin/melbad" --version

  # The melba crate must keep compiling on the other desktop targets; a
  # cfg gate once swallowed eframe::run_native entirely. A check build
  # never links, so no MinGW toolchain is needed on the runner.
  windows-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: rustup target add x86_64-pc-windows-gnu
        working-directory: crates/melba
      - name: MinGW C compiler for the Windows target
        run: |
          bash ci/apt-transfers.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --target x86_64-pc-windows-gnu --all-targets
        working-directory: crates/melba

  # Non-blocking on purpose. The 2026-10-27 lockfile bump cleared the
  # quinn-proto, rustls, webpki-roots and webpki-root-certs advisories.
  # cargo-audit 0.22.2 still exits 1 for rustls-webpki 0.103.15
  # (RUSTSEC-2026-0382), which has no fixed stable release yet.
  # Drop continue-on-error when a fixed rustls-webpki is available.
  cargo-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-audit (pinned binary)
        run: |
          set -uo pipefail
          tgz="${RUNNER_TEMP}/cargo-audit.tgz"
          curl -fsSL --retry 3 -o "$tgz" \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  $tgz" | sha256sum -c
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          audit="${RUNNER_TEMP}/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit"
          rc=0
          "$audit" audit --file Cargo.lock || rc=1
          "$audit" audit --file crates/melba/Cargo.lock || rc=1
          exit "$rc"

  # Full history. Fails on findings. The one historical generic-api-key
  # hit (084f29b, removed crates/aml-ui2/src/zeroconf.rs, Spotifast import
  # test string) is allowlisted in .gitleaks.toml.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (pinned binary)
        run: |
          set -euo pipefail
          tgz="${RUNNER_TEMP}/gitleaks.tgz"
          curl -fsSL --retry 3 -o "$tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tgz" | sha256sum -c
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --exit-code 1
