name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# A push that supersedes an unfinished run should cancel it. Without this,
# three pushes to one pull request run three complete matrices at once, which
# is most of what made CI look expensive: the later runs answer a question
# nobody is waiting for any more.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    # The suite takes about 12 minutes. Without a limit a stalled mirror left
    # this job in `apt-get update` for 44 minutes with nothing to stop it,
    # blocking a release PR behind a check that would never conclude. The limit
    # is a backstop, not a budget: a mirror that is merely slow still has to
    # fit (one took 30 minutes for the GTK/WebKit headers alone), while a
    # stalled socket now errors after 30 seconds thanks to ci/apt-transfers.sh.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # A constant key on purpose. Hashing this file made every edit to the
          # workflow miss the cache, which is exactly when the packages are
          # wanted. The archives are versioned file names, so a stale entry is
          # harmless: apt verifies what it reuses and downloads the rest.
          #
          # The cache directory must be writable by the runner, so the debs are
          # staged under $HOME and copied in and out around the install.
          key: apt-debs-${{ runner.os }}
          restore-keys: apt-debs-${{ runner.os }}
          path: ~/.cache/melba-apt
      - name: Release signing script syntax and missing-key fail-closed gate
        run: |
          set -euo pipefail
          bash -n ci/prepare_signed_release.sh
          if env -u MELBA_SIGNING_KEY_PEM bash ci/prepare_signed_release.sh /tmp/does-not-exist 0.3.13; then
            echo "Release signing must fail without the publisher key" >&2
            exit 1
          fi
      - name: system deps (alsa, dbus, gtk/webkit for tao+wry)
        run: |
          bash ci/apt-transfers.sh
          # Reuse the cached debs: GTK and WebKit headers are the slow part of
          # this job, and were taking over 25 minutes from the runner's mirror.
          sudo mkdir -p /var/cache/apt/archives
          sudo cp -a ~/.cache/melba-apt/. /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev libdbus-1-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libglib2.0-bin xdg-utils ffmpeg
      - name: Keep the downloaded packages for the next run
        run: |
          mkdir -p ~/.cache/melba-apt
          cp -a /var/cache/apt/archives/. ~/.cache/melba-apt/ 2>/dev/null || true
          du -sh ~/.cache/melba-apt || true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          # Pinned, matching rust-toolchain.toml: a release rebuilt later must
          # produce the same binaries, and a toolchain change has to be visible.
          toolchain: "1.99.0"
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-about --version 0.8.4 --locked
      - run: cargo fetch --locked && cargo fetch --locked --manifest-path crates/melba/Cargo.toml
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Linux-only daemon integration (including sign-in subprocess resolution)
      # is not compiled by the windows-check job below. One invocation: `--lib`
      # and `--tests` used to build the same crate twice for the same features.
      # Both targets must stay listed — `--lib` alone never ran localization,
      # which is how a stale gettext template stayed broken.
      - run: cargo test --locked --manifest-path crates/melba/Cargo.toml --all-features --lib --tests
      - run: cargo build --locked
      # check.sh fail-closes on real gates (cargo.test, import×3, scan,
      # licenses) and honestly skips what the runner lacks (no
      # /proc/asound → probe, no session bus → mpris, no gx tools → gx.*).
      - run: MELBA_BIN=./target/debug/melbad ./ci/check.sh

  # Public Release installation is intentionally not done on every push/PR:
  # - portable-baseline.yml tests newly built candidate artifacts across distros
  # - distro-install.yml verifies the signed public Release on schedule and
  #   when the release installer itself changes
  # - nix-paired.yml validates the pinned Nix Release when its package changes
  #   and on a weekly schedule
  # - release-publish.yml checks the newly published signed Release end to end

  # The melba crate must keep compiling on the other desktop targets; a
  # cfg gate once swallowed eframe::run_native entirely. A check build
  # never links, so no MinGW toolchain is needed on the runner.
  windows-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          # Pinned, matching rust-toolchain.toml: a release rebuilt later must
          # produce the same binaries, and a toolchain change has to be visible.
          toolchain: "1.99.0"
        with:
          targets: x86_64-pc-windows-gnu
      - run: rustup target add x86_64-pc-windows-gnu
        working-directory: crates/melba
      - name: MinGW C compiler for the Windows target
        run: |
          bash ci/apt-transfers.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --locked --target x86_64-pc-windows-gnu --all-targets
        working-directory: crates/melba

  # Fails on any RustSec advisory in either lockfile. The 2026-10-27
  # lockfile bump cleared the quinn-proto, rustls, webpki-roots and
  # webpki-root-certs advisories.
  # rustls-webpki 0.103.16 carries the fix for RUSTSEC-2026-0382, so the
  # exemption that kept this job from failing the build is gone: an advisory
  # with no fix is not a reason to stop reading advisories.
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-audit (pinned binary)
        run: |
          set -uo pipefail
          tgz="${RUNNER_TEMP}/cargo-audit.tgz"
          bash ci/fetch-release-asset.sh rustsec/rustsec cargo-audit/v0.22.2 \
            cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz "$tgz" \
            ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          audit="${RUNNER_TEMP}/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit"
          rc=0
          "$audit" audit --file Cargo.lock || rc=1
          "$audit" audit --file crates/melba/Cargo.lock || rc=1
          exit "$rc"

  # Full history. Fails on findings. The one historical generic-api-key
  # hit (084f29b, removed crates/aml-ui2/src/zeroconf.rs, Spotifast import
  # test string) is allowlisted in .gitleaks.toml.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (pinned binary)
        run: |
          set -euo pipefail
          tgz="${RUNNER_TEMP}/gitleaks.tgz"
          bash ci/fetch-release-asset.sh gitleaks/gitleaks v8.30.1 \
            gitleaks_8.30.1_linux_x64.tar.gz "$tgz" \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --exit-code 1
