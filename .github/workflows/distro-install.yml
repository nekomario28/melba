name: distro install

# Installing the published release in a real distro image answers two different
# questions: does `install-release.sh` still work (this changes with the
# installer), and does the release currently on GitHub still install (this
# changes without anyone touching the repository). Neither belongs on every
# pull request: the candidate is already exercised in seven images by
# `portable-baseline.yml`, and release-time installation in five is part of
# publishing. So: the installer's own files, plus a weekly check that catches a
# release going stale on a distro, plus a manual button.

on:
  pull_request:
    paths:
      - "packaging/install-release.sh"
      - "packaging/install-deps.sh"
      - "packaging/install-wrapper.sh"
      - "ci/test_packaging.py"
      - "ci/apt-transfers.sh"
      - ".github/workflows/distro-install.yml"
  push:
    branches: [main]
    paths:
      - "packaging/install-release.sh"
      - "packaging/install-deps.sh"
      - "packaging/install-wrapper.sh"
      - ".github/workflows/distro-install.yml"
  schedule:
    # A release can stop installing without a commit: a mirror drops a package,
    # a distro image moves. Weekly is enough to notice.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: distro-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  distro-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Every image here can run the published release: since v0.3.13 the
      # archives need glibc 2.35, not 2.43. ubuntu-22.04 and debian-12 are the
      # floor and exist to pin it. The refusal path (an older glibc installs
      # nothing) is pinned by ci/test_packaging.py, which stubs `ldd`; no
      # maintained image in this matrix is below the baseline, and adding an
      # end-of-life one would make the job fail for mirror reasons instead.
      matrix:
        include:
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            manager: apt-get
          - distro: debian-12
            image: debian:bookworm
            manager: apt-get
          - distro: debian-13
            image: debian:trixie
            manager: apt-get
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            manager: apt-get
          - distro: ubuntu-26.04
            image: ubuntu:26.04
            manager: apt-get
          - distro: fedora-43
            image: fedora:43
            manager: dnf
          - distro: fedora-44
            image: fedora:44
            manager: dnf
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap release installer prerequisites
        shell: bash
        env:
          PKG_MANAGER: ${{ matrix.manager }}
        run: |
          set -euo pipefail
          if [[ "$PKG_MANAGER" = apt-get ]]; then
            bash ci/apt-transfers.sh
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl openssl
          else
            dnf -y install ca-certificates curl openssl
          fi
      - name: Install ALAC helper prerequisites through actual apt or dnf
        shell: bash
        run: |
          set -euo pipefail
          sh packaging/install-deps.sh --alac
          for tool in bash curl unzip file cc; do command -v "$tool"; done
      - name: Install the published signed Release and run both binaries
        shell: bash
        run: |
          set -euo pipefail
          export MELBA_PORTABLE_DIR="$RUNNER_TEMP/melba-distro-test/app"
          export XDG_BIN_HOME="$RUNNER_TEMP/melba-distro-test/bin"
          export XDG_DATA_HOME="$RUNNER_TEMP/melba-distro-test/data"
          sh packaging/install-release.sh --no-alac
          test -L "$XDG_BIN_HOME/melba"
          test -L "$XDG_BIN_HOME/melbad"
          "$MELBA_PORTABLE_DIR/melba" --version
          "$MELBA_PORTABLE_DIR/melbad" --version
