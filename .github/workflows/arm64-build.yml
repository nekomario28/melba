name: arm64 build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: system deps (arm64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libasound2-dev libdbus-1-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: build release binaries
        run: |
          cargo build --release --locked --bin melbad
          cargo build --release --locked --manifest-path crates/melba/Cargo.toml --bin melba
      - name: package portable arm64 archives
        run: |
          ./packaging/package-portable.sh release-aarch64 0.3.5 \
            crates/melba/target/release/melba target/release/melbad \
            aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: melba-aarch64
          path: release-aarch64
          if-no-files-found: error
