name: portable GNU ABI baseline

on:
  pull_request:
    paths:
      - ".github/workflows/portable-baseline.yml"
      - ".github/workflows/arm64-build.yml"
      - "ci/check_glibc_abi.py"
      - "ci/test_glibc_abi.py"
      - "packaging/package-portable.sh"
      - "Cargo.lock"
      - "crates/melba/Cargo.lock"
      - "Cargo.toml"
      - "crates/melba/**"
      - "src/**"
      - "packaging/licenses.py"
      - "packaging/licenses/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-build:
    name: glibc 2.35 build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    container:
      image: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Bootstrap checkout prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install oldest supported native GUI/audio build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential binutils cmake pkg-config python3 \
            libasound2-dev libdbus-1-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          ldd --version | head -1
          pkg-config --modversion webkit2gtk-4.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build both binaries from controlled glibc 2.35
        run: |
          set -eu
          python3 -m unittest discover -s ci -p 'test_glibc_abi.py'
          cargo build --release --locked --bin melbad
          cargo build --release --locked --manifest-path crates/melba/Cargo.toml --bin melba
          python3 ci/check_glibc_abi.py 2.35 target/release/melbad crates/melba/target/release/melba
      - name: Collect mandatory license notices
        run: |
          set -eu
          cargo install cargo-about --version 0.8.4 --locked
          cargo fetch --locked
          cargo fetch --locked --manifest-path crates/melba/Cargo.toml
          ./ci/licenses.sh target/third-party
      - name: Package complete unsigned candidate archives
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -eu
          # Ubuntu 22.04 has Python 3.10 (tomllib is not available).
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          ./packaging/package-portable.sh release-candidate "$version" \
            crates/melba/target/release/melba target/release/melbad \
            "$RELEASE_TARGET" target/third-party
          test -s release-candidate/checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-baseline-${{ matrix.arch }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7

  candidate-consumer:
    name: candidate smoke (${{ matrix.distro }})
    needs: baseline-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            manager: apt
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            manager: apt
          - distro: debian-12
            image: debian:bookworm
            manager: apt
          - distro: debian-13
            image: debian:trixie
            manager: apt
          - distro: fedora-43
            image: fedora:43
            manager: dnf
          - distro: fedora-44
            image: fedora:44
            manager: dnf
          - distro: ubuntu-26.04
            image: ubuntu:26.04
            manager: apt
          - distro: arch
            image: archlinux:latest
            manager: pacman
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Bootstrap for artifact downloader
        shell: bash
        env:
          PKG_MANAGER: ${{ matrix.manager }}
        run: |
          set -euo pipefail
          if [[ "$PKG_MANAGER" == apt ]]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl tar
          elif [[ "$PKG_MANAGER" == dnf ]]; then
            dnf -y install ca-certificates curl tar
          else
            pacman -Syu --noconfirm --needed ca-certificates curl tar
            update-ca-trust || true
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-baseline-x86_64
          path: candidate
      - name: Install runtime system libraries and test candidate executables
        shell: bash
        env:
          PKG_MANAGER: ${{ matrix.manager }}
        run: |
          set -euo pipefail
          if [[ "$PKG_MANAGER" == apt ]]; then
            # Ubuntu 24.04's libasound2 is virtual and needs the t64 provider.
            # Debian 12 / Ubuntu 22.04 have no libasound2t64 package.
            alsa_pkg=libasound2
            if apt-cache show libasound2t64 >/dev/null 2>&1; then
              alsa_pkg=libasound2t64
            fi
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-0 "$alsa_pkg" libdbus-1-3 libxkbcommon0
          elif [[ "$PKG_MANAGER" == dnf ]]; then
            dnf -y install webkit2gtk4.1 alsa-lib dbus-libs libxkbcommon
          else
            pacman -S --noconfirm --needed webkit2gtk-4.1 alsa-lib dbus libxkbcommon
          fi
          archive=$(find candidate -name 'melba-v*-x86_64-unknown-linux-gnu.tar.gz' -print -quit)
          test -n "$archive"
          mkdir -p extracted
          tar -xzf "$archive" -C extracted
          test "$(find extracted -name melba-portable.txt | wc -l)" -eq 1
          binary=$(find extracted -name melba -type f -print -quit)
          daemon=$(find extracted -name melbad -type f -print -quit)
          test -x "$binary"
          test -x "$daemon"
          "$binary" --version
          "$daemon" --version
          { ldd "$binary"; ldd "$daemon"; } | tee /tmp/melba-ldd.log
          ! grep -q 'not found' /tmp/melba-ldd.log
          ! grep -Eq 'GLIBC_[0-9]+\\.[0-9]+.*not found' /tmp/melba-ldd.log
