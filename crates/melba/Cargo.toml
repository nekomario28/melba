[package]
name = "melba"
default-run = "melba"
version = "0.3.10"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Apple Music client for Linux — native egui UI on the melbad daemon"
repository = "https://github.com/nekomario28/melba"
keywords = ["apple-music", "music", "egui", "player"]
categories = ["multimedia::audio"]

[lib]
name = "melba"
path = "src/lib.rs"

[[bin]]
name = "melba"
path = "src/melba.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed local sign-in prompts; secret input is redacted and erased on drop.
melba-auth = { path = "../melba-auth" }
log = "0.4"
directories = "6"
# One protected-store API, with only each target's native provider below.
# Durable grants must not be copied into ordinary state JSON.
# The whole UI. glow keeps the binary and the dependency tree small; wgpu is
# not needed for a 2D music client.
# AccessKit connects egui's control names, states, and actions to native screen readers.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg"] }
# The shared foundation of Spotifast, ZapFast, RekordFlash and TonePush
# (crmne/fastframe). Every crate comes from the same revision; move them
# together. Dock icons and badges share the same foundation as the tray.
fastframe-text = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# Colour emoji in the platform's own style (Apple Color Emoji, Segoe UI
# Emoji, the desktop's colour emoji font), in every text through its egui
# plugin.
fastframe-emoji = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# Catalogs compiled from PO files at build time (see build.rs) and the
# system's preferred languages. No libintl or runtime catalog parsing.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# The log file for bug reports and the panic log (env_logger underneath).
fastframe-log = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# The tray item, so closing the window can keep the music playing:
# StatusNotifier on Linux, the notification area on Windows, the menu bar
# on macOS.
fastframe-tray = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# Keeps the app running without a window around eframe::run_native.
fastframe-shell = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# The title bar the app draws itself: the header drag and double-click on
# every platform, and on Windows and Linux the caption buttons and resizable
# edges when the listener turns the platform's frame off.
fastframe-titlebar = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# Self-update from GitHub releases, on the reqwest client below.
fastframe-update = { path = "../../vendor/fastframe-update", features = ["reqwest"] }
# Settings, the session, the history, caches and the credential markers
# are replaced whole: a temporary file beside each, synced to the disk, then
# moved over it (written through on Windows), so a crash never leaves half.
fastframe-file = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# The device's power, session and network state: energy saver, battery,
# display, lock, the internet's reach and cost, sleep and wake, and the App
# Nap activity local playback holds on macOS.
fastframe-power = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# The audio device stream: it pauses, so a paused player costs no CPU (#636),
# follows the default output and reopens after a failure. Its cpal 0.18
# The wheel step, the Linux touchpad scale and glide, and the axis a scroll
# gesture holds.
fastframe-scroll = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# One running copy per user: a lock and a private channel that a second
# launch and the command line hand their requests to.
fastframe-instance = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# The desktop's media controls: MPRIS on Linux, the media overlay on
# Windows, Now Playing on macOS. The media keys and those panels send
# commands back, and closing the window keeps the music playing.
fastframe-now-playing = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# webp is for cover URLs: some artwork arrives as WebP, and without the
# decoder it fails to decode and the placeholder is drawn.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Filling glyph outlines with no anti-aliasing for the thumbbar icons
# (src/thumbbar.rs). Already compiled for the SVG icons through
# egui_extras and resvg, so this adds no code to the build.
tiny-skia = "0.11"
# Detect the live window backend. eframe already compiles this crate.
raw-window-handle = "0.6"
# Spotify playback and Connect. rustls everywhere so the client links one TLS
# stack and builds without OpenSSL on every platform.
#
# `socks` is SOCKS5 proxy support for the Web API, artwork, lyrics, and
# update checks. HTTP proxies work without it. `system-proxy` reads the OS
# proxy on macOS and Windows when the mode is System; Linux uses environment
# variables either way.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "blocking", "socks", "system-proxy"] }
# Same System-proxy matcher reqwest uses, so local playback follows the same
# HTTP proxy (environment, and the OS proxy on macOS and Windows).
http = "1"
# `fs` is used by the playlist cache in `backend.rs`. On Linux the MPRIS
# dependency happens to turn it on, which is why leaving it out built
# there and nowhere else. `net` is the local HTTP-proxy tests.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
# Native asynchronous file selection on macOS, Windows and Linux desktop portals.
rfd = "0.17.2"
rand = "0.9"
open = "5"
percent-encoding = "2"
jiff = "0.2"
unicode-bidi = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# The packaged Dock artwork also identifies unbundled Cargo runs.
fastframe-dock = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
# The application menus and Dock menu (src/mac_menu.rs). "exception" lets
# src/mac_touchbar_crash_guard.rs catch a specific AppKit Objective-C
# exception instead of letting it abort the process. NSWorkspace and
# NSAccessibility answer whether the user asked for less motion
# (src/motion.rs).
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSWindow", "NSView", "NSScreen", "NSColor", "NSImage", "NSImageView", "NSButton", "NSControl", "NSTrackingArea", "NSVisualEffectView", "NSTextField", "NSBezierPath", "NSFont", "NSAnimation", "NSAnimationContext", "NSWorkspace"] }
# NSAppleEventManager and NSAppleEventDescriptor carry the links macOS hands
# an app registered for the scheme (src/mac_links.rs), and
# NSRunLoop has the delayed perform that minimizes the window
# (src/window.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString", "NSThread", "NSDictionary", "NSAttributedString", "NSData"] }

[target.'cfg(windows)'.dependencies]
# Message loops, the taskbar thumbnail buttons and window styles.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# melbad daemon transport: MPRIS properties/methods plus the melba:* queue
# calls on org.mpris.MediaPlayer2.melba (`daemon_worker.rs`).
dbus = "0.9"
# Nonblocking private CLI pipes; already used by the Linux desktop stack.
libc = "0.2"
# Reuses the zbus/Tokio stack already used for desktop integration.
# The session bus, for the desktop's light or dark preference
# (src/appearance.rs). fastframe-now-playing's MPRIS already compiles this
# version.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
# Drops unfinished PO entries and compiles catalog text and gettext plural
# expressions to Rust. Ordinary builds do not need gettext tools.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5", features = ["build"] }

[dev-dependencies]
# Egui persistence uses RON; JSON cannot represent all of Memory’s map keys.
ron = "0.12"
# Checks that every catalog covers the template and keeps its placeholders.
polib = "0.3"
# Run connection-deadline regressions with a virtual clock.
tokio = { version = "1", features = ["test-util"] }

# The icon and version information Windows shows for the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
# Sample data and screenshot flags; never part of a release build.
demo = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Audio decoding and immediate-mode layout are too slow at opt-level 0 to
# audition the app in development. Keep every dependency optimized while the
# application crate itself stays incremental.
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# crmne/egui apps-0.36, shared with ZapFast, RekordFlash and TonePush: egui
# 0.36.1 with right-to-left runs shaped in their bidi direction and digits
# shaped left to right in text without right-to-left letters
# (emilk/egui#8577), egui's busy-loop fix (emilk/egui#8398), and eframe pacing
# Wayland frames by the compositor's frame callbacks so a window the
# compositor stops showing never blocks in a vsync swap (emilk/egui#8631,
# #266), each emoji cluster laid out one emoji wide, and egui's clipboard
# sharing its Wayland data device with winit's file drops (#614), accesskit
# focus on a widget drawn a frame later (emilk/egui#8621), a compatibility
# profile when a core GL context fails (emilk/egui#8655), and the zoom factor
# saved with the window size so a zoomed window keeps its size
# (emilk/egui#8656). Every egui
# crate comes from the same revision so they share one emath and epaint.
# Drop this once egui releases these changes.
ecolor = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
eframe = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
emath = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
# crmne/winit apps-0.30, shared with the same apps: winit 0.30.13 plus Wayland
# `Occluded` for the xdg-shell suspended state with commits on the app's behalf
# while it isn't presenting (rust-windowing/winit#4709, #4710), macOS Quit
# through close requests behind a feature Spotifast leaves off (winit#4692),
# a macOS window ordered out and flushed before it closes, so a Touch Bar
# cannot leave a ghost window behind (winit#4728), preserving the menu-bar
# window when the event loop exits (winit#4754), starting the event loop after
# a background tray has already launched AppKit (winit#4770), and file drag and drop on
# Wayland through the one data device egui's
# clipboard also uses, since Hyprland gives the clipboard and drags only to an
# app's first data device (#614). eframe from the fork above calls the
# Occluded API and shares that device. Move both forks together with the
# other apps.
winit = { git = "https://github.com/crmne/winit", rev = "0bed9dc0a7db02590a279fb8bac795fa39ee6948" }
[workspace]
