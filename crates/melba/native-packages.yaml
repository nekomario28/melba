# Shared CLI: gem install native-packages --version 0.9.0
---
schema: 1
tool:
  version: 0.9.0
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use the ALSA t64 package name. Override ELF
# inference as well as the explicit dependencies below.
libraries:
  libasound.so.2:
    deb: libasound2t64
    rpm: alsa-lib
nfpm:
  name: melba
  maintainer: Carmine Paolino <carmine@paolino.me>
  homepage: https://github.com/nekomario28/melba
  description: A native Spotify client
  license: MIT
  contents:
  # A glob source makes nFPM append its basename to the destination directory.
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/melba"
    dst: "/usr/bin/"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/melba/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/melba/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/applications/*.desktop"
    dst: "/usr/share/applications/"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/*-v@VERSION@-@TARGET@/packaging/icons/*.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/"
    file_info:
      mode: 420
  - src: contrib/omarchy/melba.json.tpl
    dst: /usr/share/melba/omarchy/melba.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/melba-theme
    dst: /usr/share/melba/omarchy/melba-theme
    file_info:
      mode: 493
  overrides:
    # ELF inspection cannot discover the GUI's dlopen dependencies. Keep
    # these aligned with winit/glutin/rfd and packaging/check-runtime-libs.c.
    deb:
      depends:
      - libdbus-1-3
      - libc6 (>= 2.39)
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64
      - libpulse0
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - dbus-libs
      - glibc >= 2.39
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - pulseaudio-libs
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'melba-@TAG@-macos-universal.dmg'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/melba-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: melba-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/melba-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: melba-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  # Windows Installer packages, built on each Windows release runner from the
  # binary it built; the input folder holds what the package installs.
  windows-amd64:
    platform: windows
    arch: amd64
    compiler_target: x86_64-pc-windows-msvc
    formats: [msi]
    input:
      kind: directory
      local: dist/msi-input-x86_64-pc-windows-msvc
    native:
      command: [python, packaging/windows/build-msi.py, '@PAYLOAD@', '@PACKAGE@', '@VERSION@', '@ARCH@']
      output: 'melba-@TAG@-@TARGET@.msi'
  windows-arm64:
    platform: windows
    arch: arm64
    compiler_target: aarch64-pc-windows-msvc
    formats: [msi]
    input:
      kind: directory
      local: dist/msi-input-aarch64-pc-windows-msvc
    native:
      command: [python, packaging/windows/build-msi.py, '@PAYLOAD@', '@PACKAGE@', '@VERSION@', '@ARCH@']
      output: 'melba-@TAG@-@TARGET@.msi'
release:
  repository: nekomario28/melba
  prereleases: true
  checksums: checksums.txt
assets:
  AMD64:
    file: melba-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/melba-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: melba-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/melba-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  SOURCE:
    file: melba-v@VERSION@-source.tar.gz
    local: dist/melba-v@VERSION@-source.tar.gz
  MACOS:
    file: melba-v@VERSION@-macos-universal.dmg
    local: dist/melba-v@VERSION@-macos-universal.dmg
templates:
  arch/melba/PKGBUILD: packaging/arch/melba/PKGBUILD.in
  arch/melba/melba.install: packaging/arch/melba.install
  arch/melba-bin/PKGBUILD: packaging/arch/melba-bin/PKGBUILD.in
  arch/melba-bin/melba-bin.install: packaging/arch/melba.install
  arch/melba-git/PKGBUILD: packaging/arch/melba-git/PKGBUILD.in
  arch/melba-git/melba-git.install: packaging/arch/melba.install
  homebrew/melba.rb: packaging/homebrew/melba.rb.in
repositories:
  aur-source:
    group: aur
    url: https://aur.archlinux.org/melba.git
    push_url: ssh://aur@aur.archlinux.org/melba.git
    branch: master
    package_path: "."
    files:
      arch/melba: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/melba-bin.git
    push_url: ssh://aur@aur.archlinux.org/melba-bin.git
    branch: master
    package_path: "."
    files:
      arch/melba-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/melba-git.git
    push_url: ssh://aur@aur.archlinux.org/melba-git.git
    branch: master
    package_path: "."
    files:
      arch/melba-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  homebrew:
    url: https://github.com/crmne/homebrew-tap.git
    push_url: https://github.com/crmne/homebrew-tap.git
    branch: main
    package_path: Casks
    files:
      homebrew/melba.rb: Casks/melba.rb
    version_file: Casks/melba.rb
    version_pattern: version "([^"]+)"
    publish: push
version_file: Cargo.toml
