[package]
name = "melba-auth"
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Private sign-in protocol shared by Melba and melbad"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Erase transient credentials on drop; never include them in Debug output.
zeroize = "1.9"
